name: Release

# Triggered by pushing a version tag (e.g. v1.2.3).
# - build job runs immediately, produces an unsigned universal .app artifact.
# - release job is gated by the `release-signing` GitHub Environment;
#   secrets only mount after a required reviewer approves the run.
on:
  push:
    tags:
      - 'v*'

# Default: no permissions. Each job declares what it needs.
permissions: {}

# Never run two release jobs against the same tag concurrently. Killing a
# notarization mid-flight is worse than queuing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal .app
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the main-ancestry guard below can reach origin/main.
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid semver-shaped version (vX.Y.Z[-suffix])"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BannerShift version: $VERSION"

      - name: Verify tag points at a commit reachable from main
        # Defense against accidentally releasing from a feature branch: even if
        # someone (or something) pushes a v* tag at a non-main commit, this
        # check refuses to proceed before any secrets mount or any signing
        # runs. The release pipeline only ships code that has landed on main.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/main. Refusing to release a non-main commit."
            exit 1
          fi
          echo "Tag is on main lineage; proceeding."

      - name: Cache Swift build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-

      - name: Inject version into Info.plist
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION"           Resources/Info.plist
          plutil -lint Resources/Info.plist

      - name: Run tests
        run: swift test

      - name: Build universal .app (ad-hoc signed; release job re-signs)
        run: ./scripts/build-dev.sh

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: BannerShift-app-unsigned
          path: build/BannerShift.app
          retention-days: 1
          if-no-files-found: error

  release:
    name: Sign, notarize, publish
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    # The environment provides the manual-approval gate. Configure required
    # reviewers under Settings > Environments > release-signing.
    environment:
      name: release-signing
      url: ${{ steps.publish.outputs.release_url }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout (entitlements only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download unsigned .app
        uses: actions/download-artifact@v4
        with:
          name: BannerShift-app-unsigned
          path: build/BannerShift.app

      - name: Restore executable bit on binary
        # actions/upload-artifact drops POSIX permissions; re-set +x on the
        # mach-O so codesign and execution work.
        run: chmod +x build/BannerShift.app/Contents/MacOS/BannerShift

      - name: Import Developer ID cert into ephemeral keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # Create an ephemeral keychain isolated from the runner default.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode the .p12 into a temp file with restrictive perms, import, then delete.
          P12_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$P12_PATH"

          # Allow codesign to use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend the build keychain to the search list so codesign finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Stage App Store Connect API key
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          AC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$AC_KEY_PATH"
          echo "AC_KEY_PATH=$AC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Codesign .app with Developer ID
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --sign "$IDENTITY" \
            --entitlements Resources/BannerShift.entitlements \
            --options runtime \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            build/BannerShift.app
          codesign --verify --deep --strict --verbose=2 build/BannerShift.app

      - name: Notarize .app
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          NOTARIZATION_ZIP="$RUNNER_TEMP/BannerShift-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent build/BannerShift.app "$NOTARIZATION_ZIP"

          # notarytool --wait returns 0 on both Accepted and Invalid, so parse status ourselves.
          SUBMIT_JSON="$(xcrun notarytool submit "$NOTARIZATION_ZIP" \
            --key "$AC_KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait \
            --output-format json)"

          SUBMISSION_ID="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          STATUS="$(       printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "App submission $SUBMISSION_ID terminal status: $STATUS"

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::App notarization failed: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$AC_KEY_PATH" \
              --key-id "$AC_API_KEY_ID" \
              --issuer "$AC_API_ISSUER_ID" || true
            exit 1
          fi

          rm -f "$NOTARIZATION_ZIP"

      - name: Staple notarization ticket to .app
        run: |
          set -euo pipefail
          xcrun stapler staple build/BannerShift.app
          xcrun stapler validate build/BannerShift.app
          # Smoke check: informational, do not fail the build on a Gatekeeper quirk.
          spctl --assess --type execute -vv build/BannerShift.app || true

      - name: Package distributable .zip
        run: |
          set -euo pipefail
          ZIP_PATH="build/BannerShift-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/BannerShift.app "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize .dmg
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG_PATH="build/BannerShift-${VERSION}.dmg"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R build/BannerShift.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          hdiutil create \
            -volname "BannerShift" \
            -srcfolder "$DMG_STAGE" \
            -format UDZO \
            -fs HFS+ \
            -ov \
            "$DMG_PATH"

          # The DMG itself is also a signable, notarizable artifact.
          codesign --force --sign "$IDENTITY" \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"

          SUBMIT_JSON="$(xcrun notarytool submit "$DMG_PATH" \
            --key "$AC_KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait \
            --output-format json)"

          SUBMISSION_ID="$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          STATUS="$(       printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "DMG submission $SUBMISSION_ID terminal status: $STATUS"

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::DMG notarization failed: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$AC_KEY_PATH" \
              --key-id "$AC_API_KEY_ID" \
              --issuer "$AC_API_ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Tear down keychain and secrets
        if: always()
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "${AC_KEY_PATH:-/dev/null}"

      - name: Compute artifact checksums
        run: |
          set -euo pipefail
          ( cd build && shasum -a 256 "BannerShift-${VERSION}.zip" "BannerShift-${VERSION}.dmg" ) \
            | tee "build/BannerShift-${VERSION}.sha256"
          echo "SHA_PATH=build/BannerShift-${VERSION}.sha256" >> "$GITHUB_ENV"

      - name: Publish draft GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          BannerShift ${VERSION}

          Notarized macOS build. Apple Silicon and Intel (universal binary), macOS 13+.

          ## Install

          - **.dmg**: open, drag BannerShift to Applications, launch.
          - **.zip**: unzip, move BannerShift.app to Applications, launch.

          On first launch, grant Accessibility permission in System Settings > Privacy & Security > Accessibility.

          ## Checksums

          See \`BannerShift-${VERSION}.sha256\` attached.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "BannerShift ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --draft \
            "$ZIP_PATH" "$DMG_PATH" "$SHA_PATH"

          RELEASE_URL="$(gh release view "$GITHUB_REF_NAME" --json url --jq .url)"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Draft release created: $RELEASE_URL"
          echo "Visit the URL to edit notes and publish."
